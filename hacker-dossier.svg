<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 290" width="100%" height="290">
  
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="termBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#04060a"/>
      <stop offset="50%" stop-color="#080c14"/>
      <stop offset="100%" stop-color="#05080f"/>
    </linearGradient>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0b111e" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#070b14" stop-opacity="0.98"/>
    </linearGradient>
    <linearGradient id="neonGreenGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00ff66"/>
      <stop offset="100%" stop-color="#00e5ff"/>
    </linearGradient>
    <linearGradient id="crimsonGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff0055"/>
      <stop offset="100%" stop-color="#ff3366"/>
    </linearGradient>
    
    <!-- Neon Glow Filters -->
    <filter id="glowGreen" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="glowRed" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="glowCyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Scanline Pattern -->
    <pattern id="scanlines" width="100" height="4" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="100" y2="0" stroke="#000000" stroke-width="1.2" opacity="0.35"/>
    </pattern>
    
    <!-- Matrix Grid Pattern -->
    <pattern id="cyberGrid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#00ff66" stroke-width="0.5" opacity="0.08"/>
    </pattern>

    <style>
      @keyframes blink {
        0%, 49% { opacity: 1; }
        50%, 100% { opacity: 0; }
      }
      @keyframes radarSweep {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      @keyframes pulseTerminal {
        0%, 100% { filter: drop-shadow(0 0 6px rgba(0, 255, 102, 0.4)); }
        50% { filter: drop-shadow(0 0 14px rgba(0, 255, 102, 0.8)); }
      }
      @keyframes laserMove {
        0% { transform: translateY(0); }
        50% { transform: translateY(110px); }
        100% { transform: translateY(0); }
      }
      .font-mono { font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, 'Courier New', monospace; }
      .font-sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
      .cursor { animation: blink 1s infinite; }
      .radar-sweep { transform-origin: 105px 185px; animation: radarSweep 6s linear infinite; }
      .laser-line { animation: laserMove 3.5s ease-in-out infinite; }
      .hover-card { transition: all 0.3s ease; }
      .hover-card:hover { filter: drop-shadow(0 0 10px rgba(0, 255, 102, 0.3)); }
    </style>
  </defs>


  <rect x="2" y="2" width="896" height="286" rx="8" fill="url(#termBg)" stroke="#00ff66" stroke-width="1.2" opacity="0.95"/>
  <rect x="2" y="2" width="896" height="286" rx="8" fill="url(#cyberGrid)"/>
  <rect x="2" y="2" width="896" height="286" rx="8" fill="url(#scanlines)" pointer-events="none"/>

  <!-- Header -->
  <g transform="translate(25, 26)">
    <text x="0" y="0" fill="#00ff66" class="font-mono" font-size="12" font-weight="700">[CLASSIFIED_DOSSIER]</text>
    <text x="175" y="0" fill="#ffffff" class="font-mono" font-size="15" font-weight="800">// CORE TECHNICAL CAPABILITIES &amp; ATTACK VECTORS</text>
    <line x1="0" y1="12" x2="850" y2="12" stroke="#1e293b" stroke-width="1"/>
  </g>

  <!-- 3 Cyber Cards -->
  <!-- CARD 1: Neural Intelligence -->
  <g transform="translate(25, 55)" class="hover-card">
    <rect x="0" y="0" width="270" height="210" rx="6" fill="url(#cardBg)" stroke="#00ff66" stroke-width="1"/>
    <!-- Top Card Strip -->
    <rect x="0" y="0" width="270" height="26" rx="6" fill="#0a1424" stroke="#00ff66" stroke-width="0.5"/>
    <circle cx="15" cy="13" r="4" fill="#00ff66" filter="url(#glowGreen)"/>
    <text x="28" y="17" fill="#00ff66" class="font-mono" font-size="11" font-weight="700">VECTOR_01 // AI &amp; NLP</text>

    <!-- Card Body -->
    <text x="15" y="52" fill="#ffffff" class="font-mono" font-size="14" font-weight="700">Neural Language</text>
    <text x="15" y="70" fill="#ffffff" class="font-mono" font-size="14" font-weight="700">Classification &amp; NLP</text>

    <text x="15" y="98" fill="#00e5ff" class="font-mono" font-size="11" font-weight="600">RoBERTa · Scikit · TF-IDF</text>

    <text x="15" y="125" fill="#94a3b8" class="font-mono" font-size="11">
      <tspan x="15" dy="0">High-dimensional vector</tspan>
      <tspan x="15" dy="16">similarity, automated candidate</tspan>
      <tspan x="15" dy="16">matching &amp; deep emotion</tspan>
      <tspan x="15" dy="16">sentiment intelligence.</tspan>
    </text>

    <!-- Bottom Status -->
    <rect x="15" y="180" width="240" height="20" rx="3" fill="#00ff66" fill-opacity="0.1" stroke="#00ff66" stroke-width="0.5"/>
    <text x="25" y="194" fill="#00ff66" class="font-mono" font-size="10" font-weight="700">ACCURACY: 99.2% // MODEL ACTIVE</text>
  </g>

  <!-- CARD 2: Full-Stack Systems -->
  <g transform="translate(315, 55)" class="hover-card">
    <rect x="0" y="0" width="270" height="210" rx="6" fill="url(#cardBg)" stroke="#00e5ff" stroke-width="1"/>
    <rect x="0" y="0" width="270" height="26" rx="6" fill="#0a1424" stroke="#00e5ff" stroke-width="0.5"/>
    <circle cx="15" cy="13" r="4" fill="#00e5ff" filter="url(#glowCyan)"/>
    <text x="28" y="17" fill="#00e5ff" class="font-mono" font-size="11" font-weight="700">VECTOR_02 // FULL-STACK</text>

    <text x="15" y="52" fill="#ffffff" class="font-mono" font-size="14" font-weight="700">Zero-Latency Web</text>
    <text x="15" y="70" fill="#ffffff" class="font-mono" font-size="14" font-weight="700">&amp; Distributed Systems</text>

    <text x="15" y="98" fill="#00ff66" class="font-mono" font-size="11" font-weight="600">TypeScript · Flask · React</text>

    <text x="15" y="125" fill="#94a3b8" class="font-mono" font-size="11">
      <tspan x="15" dy="0">High-throughput media intercept</tspan>
      <tspan x="15" dy="16">pipelines, low-latency WebSocket</tspan>
      <tspan x="15" dy="16">telepathic chat, and modern</tspan>
      <tspan x="15" dy="16">production-grade interfaces.</tspan>
    </text>

    <rect x="15" y="180" width="240" height="20" rx="3" fill="#00e5ff" fill-opacity="0.1" stroke="#00e5ff" stroke-width="0.5"/>
    <text x="25" y="194" fill="#00e5ff" class="font-mono" font-size="10" font-weight="700">THROUGHPUT: HIGH // SOCKETS UP</text>
  </g>

  <!-- CARD 3: Security & Cryptography -->
  <g transform="translate(605, 55)" class="hover-card">
    <rect x="0" y="0" width="270" height="210" rx="6" fill="url(#cardBg)" stroke="#ff0055" stroke-width="1"/>
    <rect x="0" y="0" width="270" height="26" rx="6" fill="#0a1424" stroke="#ff0055" stroke-width="0.5"/>
    <circle cx="15" cy="13" r="4" fill="#ff0055" filter="url(#glowRed)"/>
    <text x="28" y="17" fill="#ff0055" class="font-mono" font-size="11" font-weight="700">VECTOR_03 // CYBER DEFENSE</text>

    <text x="15" y="52" fill="#ffffff" class="font-mono" font-size="14" font-weight="700">Cryptographic Vaults</text>
    <text x="15" y="70" fill="#ffffff" class="font-mono" font-size="14" font-weight="700">&amp; Token Hardening</text>

    <text x="15" y="98" fill="#ff0055" class="font-mono" font-size="11" font-weight="600">PyJWT · Bcrypt · PostgreSQL</text>

    <text x="15" y="125" fill="#94a3b8" class="font-mono" font-size="11">
      <tspan x="15" dy="0">Zero-compromise user auth,</tspan>
      <tspan x="15" dy="16">cryptographic salt hashing,</tspan>
      <tspan x="15" dy="16">secure cookie-session vaults,</tspan>
      <tspan x="15" dy="16">and SQL injection immunity.</tspan>
    </text>

    <rect x="15" y="180" width="240" height="20" rx="3" fill="#ff0055" fill-opacity="0.1" stroke="#ff0055" stroke-width="0.5"/>
    <text x="25" y="194" fill="#ff0055" class="font-mono" font-size="10" font-weight="700">SECURITY: LEVEL 5 // HARDENED</text>
  </g>
</svg>