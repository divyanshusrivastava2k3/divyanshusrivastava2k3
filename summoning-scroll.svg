<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 230" width="1280" height="230">
  <defs>
    <linearGradient id="connectBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0c14"/>
      <stop offset="50%" stop-color="#141018"/>
      <stop offset="100%" stop-color="#0e1320"/>
    </linearGradient>

    <linearGradient id="sealOrange" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF4500"/>
      <stop offset="100%" stop-color="#FF9900"/>
    </linearGradient>

    <style>
      .mono-style {
        font-family: 'SF Pro Display', 'Fira Code', 'JetBrains Mono', 'Segoe UI', monospace;
      }
      .head-style {
        font-family: 'Impact', 'Montserrat', 'Arial Black', sans-serif;
        font-weight: 800;
        letter-spacing: 1px;
      }
    </style>
  </defs>

  <!-- Panel Base -->
  <rect width="1280" height="230" rx="18" fill="url(#connectBg)"/>
  <rect x="2" y="2" width="1276" height="226" rx="17" fill="none" stroke="#FF7700" stroke-width="1.2" stroke-opacity="0.6"/>

  <!-- Left Side: Blood Summoning Handprint & Contract Seal -->
  <g transform="translate(60, 42)">
    <!-- Seal Circles -->
    <circle cx="70" cy="73" r="60" fill="#1b1216" stroke="#ea580c" stroke-width="2"/>
    <circle cx="70" cy="73" r="46" fill="none" stroke="#ea580c" stroke-width="1" stroke-dasharray="6 4"/>
    
    <!-- Kanji characters for Summoning -->
    <text x="70" y="66" font-family="sans-serif" font-weight="900" font-size="24" fill="#dc2626" text-anchor="middle">口寄</text>
    <text x="70" y="94" font-family="sans-serif" font-weight="900" font-size="20" fill="#dc2626" text-anchor="middle">の術</text>
  </g>

  <!-- Middle Text Content -->
  <g transform="translate(240, 52)">
    <text x="0" y="16" class="mono-style" font-size="12" font-weight="800" fill="#FF7700" letter-spacing="2.5">
      // KUCHIYOSE NO JUTSU • SHINOBI ALLIANCE CONTRACT
    </text>
    <text x="0" y="52" class="head-style" font-size="30" fill="#F8FAFC">
      Let's Forge an Unbreakable Alliance
    </text>
    <text x="0" y="86" class="mono-style" font-size="13.5" fill="#94A3B8">
      Open for breakthrough AI/ML engineering, high-scale full-stack builds &amp; open-source missions.
    </text>
    <text x="0" y="110" class="mono-style" font-size="12" font-weight="600" fill="#00E5FF">
      ⚡ Response Time: Under 24 hours (Flying Thunder God Speed)
    </text>
  </g>

  <!-- Right Side: Konoha Ninja Seal Silhouette -->
  <g transform="translate(1120, 115)" opacity="0.08" stroke="#FF7700" stroke-width="10" fill="none">
    <circle cx="0" cy="0" r="80"/>
    <path d="M-40,0 A40,40 0 1,1 40,0 A20,20 0 1,1 0,0"/>
  </g>
</svg>
