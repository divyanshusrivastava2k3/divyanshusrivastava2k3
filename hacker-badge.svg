<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 270" width="100%" height="270">
  
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="termBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#04060a"/>
      <stop offset="50%" stop-color="#080c14"/>
      <stop offset="100%" stop-color="#05080f"/>
    </linearGradient>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0b111e" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#070b14" stop-opacity="0.98"/>
    </linearGradient>
    <linearGradient id="neonGreenGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00ff66"/>
      <stop offset="100%" stop-color="#00e5ff"/>
    </linearGradient>
    <linearGradient id="crimsonGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff0055"/>
      <stop offset="100%" stop-color="#ff3366"/>
    </linearGradient>
    
    <!-- Neon Glow Filters -->
    <filter id="glowGreen" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="glowRed" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="glowCyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Scanline Pattern -->
    <pattern id="scanlines" width="100" height="4" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="100" y2="0" stroke="#000000" stroke-width="1.2" opacity="0.35"/>
    </pattern>
    
    <!-- Matrix Grid Pattern -->
    <pattern id="cyberGrid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#00ff66" stroke-width="0.5" opacity="0.08"/>
    </pattern>

    <style>
      @keyframes blink {
        0%, 49% { opacity: 1; }
        50%, 100% { opacity: 0; }
      }
      @keyframes radarSweep {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      @keyframes pulseTerminal {
        0%, 100% { filter: drop-shadow(0 0 6px rgba(0, 255, 102, 0.4)); }
        50% { filter: drop-shadow(0 0 14px rgba(0, 255, 102, 0.8)); }
      }
      @keyframes laserMove {
        0% { transform: translateY(0); }
        50% { transform: translateY(110px); }
        100% { transform: translateY(0); }
      }
      .font-mono { font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, 'Courier New', monospace; }
      .font-sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
      .cursor { animation: blink 1s infinite; }
      .radar-sweep { transform-origin: 105px 185px; animation: radarSweep 6s linear infinite; }
      .laser-line { animation: laserMove 3.5s ease-in-out infinite; }
      .hover-card { transition: all 0.3s ease; }
      .hover-card:hover { filter: drop-shadow(0 0 10px rgba(0, 255, 102, 0.3)); }
    </style>
  </defs>


  <rect x="2" y="2" width="896" height="266" rx="8" fill="url(#termBg)" stroke="#00ff66" stroke-width="1.2" opacity="0.95"/>
  <rect x="2" y="2" width="896" height="266" rx="8" fill="url(#cyberGrid)"/>
  <rect x="2" y="2" width="896" height="266" rx="8" fill="url(#scanlines)" pointer-events="none"/>

  <!-- Left: Biometric / Clearance Identity Card -->
  <g transform="translate(25, 25)">
    <rect x="0" y="0" width="260" height="215" rx="6" fill="#080e18" stroke="#00ff66" stroke-width="1"/>
    
    <!-- Header of ID card -->
    <rect x="0" y="0" width="260" height="28" rx="6" fill="#0c1628" stroke="#00ff66" stroke-width="0.5"/>
    <text x="12" y="18" fill="#00ff66" class="font-mono" font-size="11" font-weight="700">BLACK-HAT OPERATOR ID</text>
    <circle cx="245" cy="14" r="4" fill="#ff0055" class="cursor"/>

    <!-- Biometric Fingerprint Box with Laser Line -->
    <g transform="translate(15, 40)">
      <rect x="0" y="0" width="80" height="110" rx="4" fill="#04070d" stroke="#1e293b" stroke-width="1"/>
      <!-- Fingerprint Curves -->
      <path d="M 20 40 Q 40 15 60 40 Q 65 70 40 95 Q 15 70 20 40" fill="none" stroke="#00ff66" stroke-width="1" stroke-opacity="0.4"/>
      <path d="M 28 45 Q 40 28 52 45 Q 55 65 40 85 Q 25 65 28 45" fill="none" stroke="#00ff66" stroke-width="1" stroke-opacity="0.6"/>
      <path d="M 35 50 Q 40 38 45 50 Q 48 60 40 75 Q 32 60 35 50" fill="none" stroke="#00ff66" stroke-width="1.2" stroke-opacity="0.8"/>
      <!-- Laser Scanning Line -->
      <line x1="2" y1="0" x2="78" y2="0" stroke="#ff0055" stroke-width="1.5" class="laser-line" filter="url(#glowRed)"/>
      <text x="40" y="105" fill="#64748b" class="font-mono" font-size="8" text-anchor="middle">BIOMETRIC: OK</text>
    </g>

    <!-- Details on ID Card -->
    <g transform="translate(105, 45)">
      <text x="0" y="12" fill="#64748b" class="font-mono" font-size="9">OPERATOR NAME</text>
      <text x="0" y="28" fill="#ffffff" class="font-mono" font-size="12" font-weight="800">DIVYANSHU S.</text>

      <text x="0" y="50" fill="#64748b" class="font-mono" font-size="9">CLEARANCE</text>
      <text x="0" y="66" fill="#ff0055" class="font-mono" font-size="12" font-weight="800">ROOT LEVEL 5</text>

      <text x="0" y="88" fill="#64748b" class="font-mono" font-size="9">IDENTIFIER</text>
      <text x="0" y="104" fill="#00e5ff" class="font-mono" font-size="12" font-weight="800">#DS-2003-ROOT</text>
    </g>

    <!-- Barcode Strip at Bottom -->
    <g transform="translate(15, 162)">
      <rect x="0" y="0" width="230" height="38" fill="#050a12" stroke="#1e293b" stroke-width="0.8"/>
      <!-- Simulated Barcode Lines -->
      <rect x="10" y="5" width="3" height="18" fill="#00ff66" opacity="0.85"/><rect x="15" y="5" width="1" height="18" fill="#00ff66" opacity="0.85"/><rect x="20" y="5" width="2" height="18" fill="#00ff66" opacity="0.85"/><rect x="25" y="5" width="3" height="18" fill="#00ff66" opacity="0.85"/><rect x="30" y="5" width="2" height="18" fill="#00ff66" opacity="0.85"/><rect x="35" y="5" width="1" height="18" fill="#00ff66" opacity="0.85"/><rect x="40" y="5" width="3" height="18" fill="#00ff66" opacity="0.85"/><rect x="45" y="5" width="1" height="18" fill="#00ff66" opacity="0.85"/><rect x="50" y="5" width="2" height="18" fill="#00ff66" opacity="0.85"/><rect x="55" y="5" width="3" height="18" fill="#00ff66" opacity="0.85"/><rect x="60" y="5" width="2" height="18" fill="#00ff66" opacity="0.85"/><rect x="65" y="5" width="1" height="18" fill="#00ff66" opacity="0.85"/><rect x="70" y="5" width="3" height="18" fill="#00ff66" opacity="0.85"/><rect x="75" y="5" width="1" height="18" fill="#00ff66" opacity="0.85"/><rect x="80" y="5" width="2" height="18" fill="#00ff66" opacity="0.85"/><rect x="85" y="5" width="3" height="18" fill="#00ff66" opacity="0.85"/><rect x="90" y="5" width="2" height="18" fill="#00ff66" opacity="0.85"/><rect x="95" y="5" width="1" height="18" fill="#00ff66" opacity="0.85"/><rect x="100" y="5" width="3" height="18" fill="#00ff66" opacity="0.85"/><rect x="105" y="5" width="1" height="18" fill="#00ff66" opacity="0.85"/><rect x="110" y="5" width="2" height="18" fill="#00ff66" opacity="0.85"/><rect x="115" y="5" width="3" height="18" fill="#00ff66" opacity="0.85"/><rect x="120" y="5" width="2" height="18" fill="#00ff66" opacity="0.85"/><rect x="125" y="5" width="1" height="18" fill="#00ff66" opacity="0.85"/><rect x="130" y="5" width="3" height="18" fill="#00ff66" opacity="0.85"/><rect x="135" y="5" width="1" height="18" fill="#00ff66" opacity="0.85"/><rect x="140" y="5" width="2" height="18" fill="#00ff66" opacity="0.85"/><rect x="145" y="5" width="3" height="18" fill="#00ff66" opacity="0.85"/><rect x="150" y="5" width="2" height="18" fill="#00ff66" opacity="0.85"/><rect x="155" y="5" width="1" height="18" fill="#00ff66" opacity="0.85"/><rect x="160" y="5" width="3" height="18" fill="#00ff66" opacity="0.85"/><rect x="165" y="5" width="1" height="18" fill="#00ff66" opacity="0.85"/><rect x="170" y="5" width="2" height="18" fill="#00ff66" opacity="0.85"/><rect x="175" y="5" width="3" height="18" fill="#00ff66" opacity="0.85"/><rect x="180" y="5" width="2" height="18" fill="#00ff66" opacity="0.85"/><rect x="185" y="5" width="1" height="18" fill="#00ff66" opacity="0.85"/><rect x="190" y="5" width="3" height="18" fill="#00ff66" opacity="0.85"/><rect x="195" y="5" width="1" height="18" fill="#00ff66" opacity="0.85"/><rect x="200" y="5" width="2" height="18" fill="#00ff66" opacity="0.85"/><rect x="205" y="5" width="3" height="18" fill="#00ff66" opacity="0.85"/><rect x="210" y="5" width="2" height="18" fill="#00ff66" opacity="0.85"/><rect x="215" y="5" width="1" height="18" fill="#00ff66" opacity="0.85"/>
      <text x="115" y="32" fill="#64748b" class="font-mono" font-size="8" text-anchor="middle">SHA-256: 8f4b23c91a0293d4e8b7c6</text>
    </g>
  </g>

  <!-- Right: Verified Operations (Real Projects) -->
  <g transform="translate(305, 25)">
    <text x="0" y="16" fill="#00ff66" class="font-mono" font-size="12" font-weight="700">[ACTIVE_PAYLOADS]</text>
    <text x="160" y="16" fill="#ffffff" class="font-mono" font-size="14" font-weight="800">// VERIFIED MISSION ARTIFACTS (REPOSITORIES)</text>
    <line x1="0" y1="28" x2="570" y2="28" stroke="#1e293b" stroke-width="1"/>

    <!-- 6 Projects in a 2x3 Grid -->
    
      <g transform="translate(0, 40)" class="hover-card">
        <rect x="0" y="0" width="275" height="48" rx="4" fill="#080e18" stroke="#00ff66" stroke-width="0.8"/>
        <text x="10" y="18" fill="#ffffff" class="font-mono" font-size="11" font-weight="700">01. RESUME-MATCHER</text>
        <rect x="180" y="6" width="85" height="14" rx="2" fill="#00ff66" fill-opacity="0.15"/>
        <text x="222" y="16" fill="#00ff66" class="font-mono" font-size="8" font-weight="700" text-anchor="middle">AI / NLP Engine</text>
        <text x="10" y="36" fill="#94a3b8" class="font-mono" font-size="9.5">TF-IDF Vector Space & Skill Distance Matcher</text>
      </g>
    
      <g transform="translate(290, 40)" class="hover-card">
        <rect x="0" y="0" width="275" height="48" rx="4" fill="#080e18" stroke="#00e5ff" stroke-width="0.8"/>
        <text x="10" y="18" fill="#ffffff" class="font-mono" font-size="11" font-weight="700">02. SENTIMENT-ANALYZER</text>
        <rect x="180" y="6" width="85" height="14" rx="2" fill="#00e5ff" fill-opacity="0.15"/>
        <text x="222" y="16" fill="#00e5ff" class="font-mono" font-size="8" font-weight="700" text-anchor="middle">RoBERTa / Neural</text>
        <text x="10" y="36" fill="#94a3b8" class="font-mono" font-size="9.5">Deep Emotion Classifier with MongoDB Pipeline</text>
      </g>
    
      <g transform="translate(0, 98)" class="hover-card">
        <rect x="0" y="0" width="275" height="48" rx="4" fill="#080e18" stroke="#ff0055" stroke-width="0.8"/>
        <text x="10" y="18" fill="#ffffff" class="font-mono" font-size="11" font-weight="700">03. SECURE-AUTH-SYSTEM</text>
        <rect x="180" y="6" width="85" height="14" rx="2" fill="#ff0055" fill-opacity="0.15"/>
        <text x="222" y="16" fill="#ff0055" class="font-mono" font-size="8" font-weight="700" text-anchor="middle">Zero-Trust Vault</text>
        <text x="10" y="36" fill="#94a3b8" class="font-mono" font-size="9.5">PyJWT & Bcrypt Salted Session Fortress</text>
      </g>
    
      <g transform="translate(290, 98)" class="hover-card">
        <rect x="0" y="0" width="275" height="48" rx="4" fill="#080e18" stroke="#f59e0b" stroke-width="0.8"/>
        <text x="10" y="18" fill="#ffffff" class="font-mono" font-size="11" font-weight="700">04. REELNOVA</text>
        <rect x="180" y="6" width="85" height="14" rx="2" fill="#f59e0b" fill-opacity="0.15"/>
        <text x="222" y="16" fill="#f59e0b" class="font-mono" font-size="8" font-weight="700" text-anchor="middle">Media Intercept</text>
        <text x="10" y="36" fill="#94a3b8" class="font-mono" font-size="9.5">High-Throughput Downloader & Web Architecture</text>
      </g>
    
      <g transform="translate(0, 156)" class="hover-card">
        <rect x="0" y="0" width="275" height="48" rx="4" fill="#080e18" stroke="#3b82f6" stroke-width="0.8"/>
        <text x="10" y="18" fill="#ffffff" class="font-mono" font-size="11" font-weight="700">05. CHATD</text>
        <rect x="180" y="6" width="85" height="14" rx="2" fill="#3b82f6" fill-opacity="0.15"/>
        <text x="222" y="16" fill="#3b82f6" class="font-mono" font-size="8" font-weight="700" text-anchor="middle">Realtime Telepath</text>
        <text x="10" y="36" fill="#94a3b8" class="font-mono" font-size="9.5">Ultra Low-Latency WebSocket Encrypted Comms</text>
      </g>
    
      <g transform="translate(290, 156)" class="hover-card">
        <rect x="0" y="0" width="275" height="48" rx="4" fill="#080e18" stroke="#10b981" stroke-width="0.8"/>
        <text x="10" y="18" fill="#ffffff" class="font-mono" font-size="11" font-weight="700">06. PORT_FOLIO</text>
        <rect x="180" y="6" width="85" height="14" rx="2" fill="#10b981" fill-opacity="0.15"/>
        <text x="222" y="16" fill="#10b981" class="font-mono" font-size="8" font-weight="700" text-anchor="middle">Mainframe Terminal</text>
        <text x="10" y="36" fill="#94a3b8" class="font-mono" font-size="9.5">Interactive Glassmorphism Cyber Showcase</text>
      </g>
    
  </g>
</svg>