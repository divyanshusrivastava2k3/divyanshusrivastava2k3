    <g transform="translate(25, 190)">
      <text x="0" y="15" fill="#ff0055" class="font-mono" font-size="12" font-weight="700">[04 // SECURITY_&_VAULT_OPS]</text>
      <g transform="translate(230, 0)">
        
          <g transform="translate(0, 0)">
            <rect x="0" y="0" width="95" height="24" rx="3" fill="#080e1a" stroke="#ff0055" stroke-width="0.8" opacity="0.9"/>
            <text x="47" y="16" fill="#e2e8f0" class="font-mono" font-size="10" font-weight="600" text-anchor="middle">PyJWT</text>
          </g>
          <g transform="translate(102, 0)">
            <rect x="0" y="0" width="95" height="24" rx="3" fill="#080e1a" stroke="#ff0055" stroke-width="0.8" opacity="0.9"/>
            <text x="47" y="16" fill="#e2e8f0" class="font-mono" font-size="10" font-weight="600" text-anchor="middle">Bcrypt</text>
          </g>
          <g transform="translate(204, 0)">
