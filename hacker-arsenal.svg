            <text x="47" y="16" fill="#e2e8f0" class="font-mono" font-size="10" font-weight="600" text-anchor="middle">SQL</text>
          </g>
          <g transform="translate(408, 0)">
            <rect x="0" y="0" width="95" height="24" rx="3" fill="#080e1a" stroke="#00ff66" stroke-width="0.8" opacity="0.9"/>
