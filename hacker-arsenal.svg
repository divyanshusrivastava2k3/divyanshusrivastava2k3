            <rect x="0" y="0" width="95" height="24" rx="3" fill="#080e1a" stroke="#00e5ff" stroke-width="0.8" opacity="0.9"/>
            <text x="47" y="16" fill="#e2e8f0" class="font-mono" font-size="10" font-weight="600" text-anchor="middle">Scikit-Learn</text>
