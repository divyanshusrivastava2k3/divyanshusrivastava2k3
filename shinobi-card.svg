<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 440" width="1280" height="440">
  <defs>
    <linearGradient id="cardBaseBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0d14"/>
      <stop offset="100%" stop-color="#141724"/>
    </linearGradient>

    <linearGradient id="passportBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1b1722"/>
      <stop offset="100%" stop-color="#11131c"/>
    </linearGradient>

    <linearGradient id="meterOrange" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF4500"/>
      <stop offset="100%" stop-color="#FF9900"/>
    </linearGradient>

    <linearGradient id="meterCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00B4D8"/>
      <stop offset="100%" stop-color="#00FFFF"/>
    </linearGradient>

    <linearGradient id="meterGold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D97706"/>
      <stop offset="100%" stop-color="#FBBF24"/>
    </linearGradient>

    <linearGradient id="meterGreen" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#34D399"/>
    </linearGradient>

    <style>
      .mono {
        font-family: 'SF Pro Display', 'Fira Code', 'JetBrains Mono', 'Segoe UI', monospace;
      }
      .heading {
        font-family: 'Impact', 'Montserrat', 'Arial Black', sans-serif;
        font-weight: 800;
      }
      @keyframes meterFill1 {
        from { width: 0px; }
        to { width: 440px; }
      }
      @keyframes meterFill2 {
        from { width: 0px; }
        to { width: 418px; }
      }
      @keyframes meterFill3 {
        from { width: 0px; }
        to { width: 396px; }
      }
      @keyframes meterFill4 {
        from { width: 0px; }
        to { width: 374px; }
      }
      .fill-bar-1 { animation: meterFill1 2.5s ease-out forwards; }
      .fill-bar-2 { animation: meterFill2 2.5s ease-out forwards; }
      .fill-bar-3 { animation: meterFill3 2.5s ease-out forwards; }
      .fill-bar-4 { animation: meterFill4 2.5s ease-out forwards; }
    </style>
  </defs>

  <!-- Panel Base -->
  <rect width="1280" height="440" rx="18" fill="url(#cardBaseBg)"/>
  <rect x="2" y="2" width="1276" height="436" rx="17" fill="none" stroke="#252d42" stroke-width="1.2"/>

  <!-- ==================== LEFT: SHINOBI REGISTRATION PASSPORT ==================== -->
  <g transform="translate(60, 40)">
    <!-- Passport Outer Frame -->
    <rect width="460" height="360" rx="16" fill="url(#passportBg)" stroke="#FF7700" stroke-width="1.5"/>
    <rect x="8" y="8" width="444" height="344" rx="12" fill="none" stroke="#FF7700" stroke-width="0.7" stroke-opacity="0.3"/>

    <!-- Konoha Shinobi Official Header -->
    <g transform="translate(24, 28)">
      <!-- Leaf Symbol -->
      <path d="M12,2 C18,2 22,6 22,12 C22,17 18,21 13,21 C9,21 6,18 6,14 C6,11 8,9 10,9 C11.5,9 12.5,10 12.5,11.5 C12.5,12.5 11.5,13.5 10.5,13.5"
            fill="none" stroke="#FF7700" stroke-width="2.2" stroke-linecap="round"/>
      <path d="M5,14 L0,20" stroke="#FF7700" stroke-width="2.2" stroke-linecap="round"/>
      <polygon points="18,8 24,5 21,11" fill="#FF7700"/>

      <text x="36" y="16" class="mono" font-size="12" font-weight="800" fill="#FF7700" letter-spacing="2">
        KONOHAGAKURE SHINOBI PASSPORT
      </text>
    </g>

    <!-- Shinobi Avatar Badge / Emblem -->
    <g transform="translate(24, 68)">
      <rect width="115" height="135" rx="10" fill="#121520" stroke="#374151" stroke-width="1.2"/>
      <!-- Glowing Uzumaki Crest inside avatar box -->
      <circle cx="57" cy="67" r="40" fill="#24130f" stroke="#FF5500" stroke-width="1.5"/>
      <path d="M57,67 A10,10 0 1,1 67,67 A20,20 0 1,1 47,67 A30,30 0 1,1 77,72" 
            fill="none" stroke="#FF7700" stroke-width="3" stroke-linecap="round"/>
      <text x="57" y="122" class="mono" font-size="9" font-weight="700" fill="#FF9933" text-anchor="middle">
        SEAL OF KURAMA
      </text>
    </g>

    <!-- Bio Details Grid -->
    <g transform="translate(155, 74)">
      <!-- Name -->
      <text x="0" y="0" class="mono" font-size="10" fill="#64748B" letter-spacing="1">SHINOBI NAME</text>
      <text x="0" y="18" class="heading" font-size="16" fill="#F8FAFC">Divyanshu Srivastava</text>

      <!-- Registration No -->
      <text x="0" y="44" class="mono" font-size="10" fill="#64748B" letter-spacing="1">REGISTRATION NO.</text>
      <text x="0" y="60" class="mono" font-size="13" font-weight="700" fill="#00E5FF">#UZU-2003-DEV</text>

      <!-- Rank & Village -->
      <text x="0" y="86" class="mono" font-size="10" fill="#64748B" letter-spacing="1">OFFICIAL RANK</text>
      <text x="0" y="102" class="mono" font-size="13" font-weight="700" fill="#FF9933">Special Jonin (AI Shinobi)</text>

      <!-- Chakra Affinity -->
      <text x="0" y="128" class="mono" font-size="10" fill="#64748B" letter-spacing="1">CHAKRA ELEMENT</text>
      <text x="0" y="144" class="mono" font-size="12" font-weight="700" fill="#FBBF24">Fire • Wind • Yin-Yang (AI)</text>
    </g>

    <!-- Bottom Stamp of Konoha Hokage Office -->
    <g transform="translate(24, 275)">
      <rect width="412" height="60" rx="8" fill="#151b2a" stroke="#253046" stroke-width="1"/>
      <path d="M0,4 L0,56" stroke="#2fd48a" stroke-width="3" stroke-linecap="round"/>
      
      <!-- Red Ink Ninja Seal Stamp -->
      <g transform="translate(350, 6) rotate(-8)">
        <rect width="46" height="46" rx="4" fill="none" stroke="#dc2626" stroke-width="2"/>
        <text x="23" y="22" font-family="sans-serif" font-weight="900" font-size="13" fill="#dc2626" text-anchor="middle">火影</text>
        <text x="23" y="38" font-family="sans-serif" font-weight="900" font-size="11" fill="#dc2626" text-anchor="middle">認可</text>
      </g>

      <text x="16" y="24" class="mono" font-size="11" font-weight="700" fill="#E2E8F0">
        MISSION STATUS: ACTIVE DUTY
      </text>
      <text x="16" y="44" class="mono" font-size="10.5" fill="#94A3B8">
        Hokage Seal: Approved for S-Rank Software Engineering
      </text>
    </g>
  </g>

  <!-- ==================== RIGHT: MISSION CAPABILITY METERS ==================== -->
  <g transform="translate(565, 40)">
    <text x="0" y="16" class="mono" font-size="12" font-weight="700" fill="#00E5FF" letter-spacing="2">
      // CHAKRA PARAMETERS &amp; COMBAT APTITUDE
    </text>
    <text x="0" y="48" class="heading" font-size="24" fill="#F1F5F9">
      Shinobi Stat Clearance Matrix
    </text>

    <!-- Meter 1: AI / NLP Models -->
    <g transform="translate(0, 78)">
      <text x="0" y="0" class="mono" font-size="12.5" font-weight="700" fill="#E2E8F0">
        AI &amp; NLP Model Architectures (Transformers / TF-IDF)
      </text>
      <text x="655" y="0" class="mono" font-size="12.5" font-weight="700" fill="#FF7700" text-anchor="end">
        98% / S-RANK
      </text>
      <!-- Track -->
      <rect x="0" y="12" width="655" height="14" rx="7" fill="#171b29" stroke="#252d42" stroke-width="0.8"/>
      <!-- Filled -->
      <rect x="0" y="12" width="642" height="14" rx="7" fill="url(#meterOrange)"/>
    </g>

    <!-- Meter 2: Full-Stack Webcraft -->
    <g transform="translate(0, 148)">
      <text x="0" y="0" class="mono" font-size="12.5" font-weight="700" fill="#E2E8F0">
        Full-Stack Systems (Flask / TypeScript / REST APIs)
      </text>
      <text x="655" y="0" class="mono" font-size="12.5" font-weight="700" fill="#00FFFF" text-anchor="end">
        94% / S-RANK
      </text>
      <!-- Track -->
      <rect x="0" y="12" width="655" height="14" rx="7" fill="#171b29" stroke="#252d42" stroke-width="0.8"/>
      <!-- Filled -->
      <rect x="0" y="12" width="615" height="14" rx="7" fill="url(#meterCyan)"/>
    </g>

    <!-- Meter 3: Security & Session Defense -->
    <g transform="translate(0, 218)">
      <text x="0" y="0" class="mono" font-size="12.5" font-weight="700" fill="#E2E8F0">
        Fūinjutsu Defense (PyJWT / Bcrypt / Data Encryption)
      </text>
      <text x="655" y="0" class="mono" font-size="12.5" font-weight="700" fill="#FBBF24" text-anchor="end">
        91% / A-RANK
      </text>
      <!-- Track -->
      <rect x="0" y="12" width="655" height="14" rx="7" fill="#171b29" stroke="#252d42" stroke-width="0.8"/>
      <!-- Filled -->
      <rect x="0" y="12" width="596" height="14" rx="7" fill="url(#meterGold)"/>
    </g>

    <!-- Meter 4: Realtime Telepathic WebSockets -->
    <g transform="translate(0, 288)">
      <text x="0" y="0" class="mono" font-size="12.5" font-weight="700" fill="#E2E8F0">
        Realtime Sync &amp; Low-Latency Messaging (WebSockets)
      </text>
      <text x="655" y="0" class="mono" font-size="12.5" font-weight="700" fill="#34D399" text-anchor="end">
        89% / A-RANK
      </text>
      <!-- Track -->
      <rect x="0" y="12" width="655" height="14" rx="7" fill="#171b29" stroke="#252d42" stroke-width="0.8"/>
      <!-- Filled -->
      <rect x="0" y="12" width="582" height="14" rx="7" fill="url(#meterGreen)"/>
    </g>
  </g>
</svg>
