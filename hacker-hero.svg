<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 370" width="100%" height="370">
  
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="termBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#04060a"/>
      <stop offset="50%" stop-color="#080c14"/>
      <stop offset="100%" stop-color="#05080f"/>
    </linearGradient>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0b111e" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#070b14" stop-opacity="0.98"/>
    </linearGradient>
    <linearGradient id="neonGreenGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00ff66"/>
      <stop offset="100%" stop-color="#00e5ff"/>
    </linearGradient>
    <linearGradient id="crimsonGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff0055"/>
      <stop offset="100%" stop-color="#ff3366"/>
    </linearGradient>
    
    <!-- Neon Glow Filters -->
    <filter id="glowGreen" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="glowRed" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="glowCyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Scanline Pattern -->
    <pattern id="scanlines" width="100" height="4" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="100" y2="0" stroke="#000000" stroke-width="1.2" opacity="0.35"/>
    </pattern>
    
    <!-- Matrix Grid Pattern -->
    <pattern id="cyberGrid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#00ff66" stroke-width="0.5" opacity="0.08"/>
    </pattern>

    <style>
      @keyframes blink {
        0%, 49% { opacity: 1; }
        50%, 100% { opacity: 0; }
      }
      @keyframes radarSweep {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      @keyframes pulseTerminal {
        0%, 100% { filter: drop-shadow(0 0 6px rgba(0, 255, 102, 0.4)); }
        50% { filter: drop-shadow(0 0 14px rgba(0, 255, 102, 0.8)); }
      }
      @keyframes laserMove {
        0% { transform: translateY(0); }
        50% { transform: translateY(110px); }
        100% { transform: translateY(0); }
      }
      .font-mono { font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, 'Courier New', monospace; }
      .font-sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
      .cursor { animation: blink 1s infinite; }
      .radar-sweep { transform-origin: 105px 185px; animation: radarSweep 6s linear infinite; }
      .laser-line { animation: laserMove 3.5s ease-in-out infinite; }
      .hover-card { transition: all 0.3s ease; }
      .hover-card:hover { filter: drop-shadow(0 0 10px rgba(0, 255, 102, 0.3)); }
    </style>
  </defs>


  <!-- Main Terminal Frame -->
  <rect x="2" y="2" width="896" height="366" rx="8" fill="url(#termBg)" stroke="#00ff66" stroke-width="1.5" opacity="0.95"/>
  <rect x="2" y="2" width="896" height="366" rx="8" fill="url(#cyberGrid)"/>
  <rect x="2" y="2" width="896" height="366" rx="8" fill="url(#scanlines)" pointer-events="none"/>

  <!-- Top Window Header Bar -->
  <rect x="2" y="2" width="896" height="34" rx="8" fill="#080e18" stroke="#00ff66" stroke-width="0.8" opacity="0.9"/>
  <!-- Window Control Dots -->
  <circle cx="22" cy="18" r="5.5" fill="#ff4d4d"/>
  <circle cx="38" cy="18" r="5.5" fill="#ffbb33"/>
  <circle cx="54" cy="18" r="5.5" fill="#00e676"/>

  <!-- Window Title -->
  <text x="75" y="22" fill="#8892b0" class="font-mono" font-size="12" font-weight="600">root@blackhat-node:~# divyanshu --profile=offensive-sec --auth=root</text>

  <!-- Status Badges in Header -->
  <g transform="translate(620, 8)">
    <rect x="0" y="0" width="125" height="20" rx="3" fill="#ff0055" fill-opacity="0.18" stroke="#ff0055" stroke-width="0.8"/>
    <circle cx="10" cy="10" r="3" fill="#ff0055"/>
    <text x="20" y="14" fill="#ff6688" class="font-mono" font-size="10" font-weight="700">ROOT PRIVILEGES</text>
  </g>
  <g transform="translate(755, 8)">
    <rect x="0" y="0" width="125" height="20" rx="3" fill="#00ff66" fill-opacity="0.15" stroke="#00ff66" stroke-width="0.8"/>
    <circle cx="10" cy="10" r="3" fill="#00ff66"/>
    <text x="20" y="14" fill="#00ff66" class="font-mono" font-size="10" font-weight="700">AES-256 ENCRYPTED</text>
  </g>

  <!-- Left Side: Cyber Skull / HUD Reticle Visual -->
  <g transform="translate(20, 48)">
    <!-- Outer Radar Circle -->
    <circle cx="105" cy="140" r="85" fill="#080e1a" stroke="#00ff66" stroke-width="1.2" stroke-opacity="0.4"/>
    <circle cx="105" cy="140" r="70" fill="none" stroke="#00ff66" stroke-width="0.8" stroke-dasharray="4 4" stroke-opacity="0.5"/>
    <circle cx="105" cy="140" r="50" fill="none" stroke="#ff0055" stroke-width="0.8" stroke-opacity="0.6"/>
    <circle cx="105" cy="140" r="28" fill="#0a1222" stroke="#00e5ff" stroke-width="1"/>

    <!-- Radar Crosshairs -->
    <line x1="20" y1="140" x2="190" y2="140" stroke="#00ff66" stroke-width="0.6" stroke-opacity="0.3"/>
    <line x1="105" y1="55" x2="105" y2="225" stroke="#00ff66" stroke-width="0.6" stroke-opacity="0.3"/>

    <!-- Radar Sweep Line -->
    <g class="radar-sweep" style="transform-origin: 105px 140px;">
      <line x1="105" y1="140" x2="190" y2="140" stroke="#00ff66" stroke-width="2" filter="url(#glowGreen)"/>
      <path d="M 105 140 L 190 140 A 85 85 0 0 0 165 80 Z" fill="#00ff66" fill-opacity="0.15"/>
    </g>

    <!-- Center Cyber Skull / Mask Vector Icon -->
    <g transform="translate(85, 120)">
      <!-- Cyber Mask Outline -->
      <path d="M 5 5 L 35 5 L 38 18 L 30 38 L 20 44 L 10 38 L 2 18 Z" fill="#0c1628" stroke="#00ff66" stroke-width="1.5"/>
      <!-- Eyes / Visor -->
      <polygon points="8,16 16,16 14,21 9,21" fill="#ff0055" filter="url(#glowRed)"/>
      <polygon points="24,16 32,16 31,21 26,21" fill="#ff0055" filter="url(#glowRed)"/>
      <!-- Mouth Grill / Data Ports -->
      <line x1="14" y1="28" x2="26" y2="28" stroke="#00ff66" stroke-width="1.5"/>
      <line x1="16" y1="32" x2="24" y2="32" stroke="#00ff66" stroke-width="1.5"/>
      <line x1="18" y1="36" x2="22" y2="36" stroke="#00ff66" stroke-width="1.5"/>
    </g>

    <!-- Radar Corner HUD Brackets -->
    <path d="M 10 50 L 10 40 L 20 40" fill="none" stroke="#00ff66" stroke-width="1.5"/>
    <path d="M 190 40 L 200 40 L 200 50" fill="none" stroke="#00ff66" stroke-width="1.5"/>
    <path d="M 10 230 L 10 240 L 20 240" fill="none" stroke="#00ff66" stroke-width="1.5"/>
    <path d="M 190 240 L 200 240 L 200 230" fill="none" stroke="#00ff66" stroke-width="1.5"/>

    <!-- Threat Readout Below Radar -->
    <rect x="25" y="248" width="160" height="24" rx="4" fill="#080e18" stroke="#00ff66" stroke-width="0.8"/>
    <text x="35" y="264" fill="#00ff66" class="font-mono" font-size="11" font-weight="700">TARGET: RECON ACTIVE</text>
  </g>

  <!-- Right Side: Terminal Content & Identity -->
  <g transform="translate(250, 52)">
    <!-- Command Prompt Executed -->
    <text x="0" y="20" fill="#64748b" class="font-mono" font-size="13">guest@terminal:~$ <tspan fill="#00ff66" font-weight="700">sudo cat /etc/shadow/identity.dat</tspan></text>

    <!-- Main Name Title -->
    <text x="0" y="66" fill="#ffffff" class="font-mono" font-size="34" font-weight="900" letter-spacing="1.5">
      DIVYANSHU SRIVASTAVA
    </text>

    <!-- Animated Glow Line Under Name -->
    <line x1="0" y1="78" x2="620" y2="78" stroke="url(#neonGreenGrad)" stroke-width="2" filter="url(#glowGreen)"/>

    <!-- Subtitle / Role -->
    <text x="0" y="104" fill="#00e5ff" class="font-mono" font-size="14" font-weight="700" letter-spacing="1">
      [+] FULL-STACK ARCHITECT // NEURAL AI &amp; NLP // CYBER SECURITY
    </text>

    <!-- Terminal Output Stream Box -->
    <rect x="0" y="120" width="620" height="135" rx="5" fill="#060a12" stroke="#1e293b" stroke-width="1"/>
    
    <g transform="translate(15, 142)">
      <text x="0" y="0" fill="#ff0055" class="font-mono" font-size="12" font-weight="700">[SYSTEM_ALERT]</text>
      <text x="120" y="0" fill="#e2e8f0" class="font-mono" font-size="12">Red-Team Terminal Initialized. High-Performance Nodes Engaged.</text>

      <text x="0" y="25" fill="#00ff66" class="font-mono" font-size="12" font-weight="700">[AI_COGNITION]</text>
      <text x="120" y="25" fill="#cbd5e1" class="font-mono" font-size="12">Transformers (RoBERTa), TF-IDF Vector Space, Semantic Matchers.</text>

      <text x="0" y="50" fill="#00e5ff" class="font-mono" font-size="12" font-weight="700">[FULLSTACK]</text>
      <text x="120" y="50" fill="#cbd5e1" class="font-mono" font-size="12">Python / Flask, React, TypeScript, Next.js, Realtime WebSockets.</text>

      <text x="0" y="75" fill="#f59e0b" class="font-mono" font-size="12" font-weight="700">[SEC_PROTOCOL]</text>
      <text x="120" y="75" fill="#cbd5e1" class="font-mono" font-size="12">PyJWT Token Signatures, Bcrypt Cryptographic Vaults, PostgreSQL.</text>

      <!-- Live Typing Prompt -->
      <text x="0" y="100" fill="#00ff66" class="font-mono" font-size="12" font-weight="700">root@divyanshu:~#</text>
      <text x="135" y="100" fill="#ffffff" class="font-mono" font-size="12">ready_for_deployment --stealth</text>
      <rect x="365" y="88" width="9" height="14" fill="#00ff66" class="cursor"/>
    </g>
  </g>

  <!-- Bottom Telemetry Bar -->
  <g transform="translate(15, 335)">
    <rect x="0" y="0" width="870" height="24" rx="4" fill="#070c16" stroke="#00ff66" stroke-width="0.6" stroke-opacity="0.4"/>
    <text x="15" y="16" fill="#64748b" class="font-mono" font-size="11">NODE: <tspan fill="#00ff66">ASIA-SOUTH-1</tspan></text>
    <text x="180" y="16" fill="#64748b" class="font-mono" font-size="11">LATENCY: <tspan fill="#00e5ff">0.18ms</tspan></text>
    <text x="330" y="16" fill="#64748b" class="font-mono" font-size="11">FIREWALL: <tspan fill="#00ff66">HARDENED</tspan></text>
    <text x="490" y="16" fill="#64748b" class="font-mono" font-size="11">DEFENSE MATRIX: <tspan fill="#ff0055">ZERO-TRUST</tspan></text>
    <text x="700" y="16" fill="#64748b" class="font-mono" font-size="11">STATUS: <tspan fill="#00ff66">OPERATIONAL ●</tspan></text>
  </g>
</svg>