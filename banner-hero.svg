<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 480" width="1280" height="480">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#08090e"/>
      <stop offset="50%" stop-color="#0d0f18"/>
      <stop offset="100%" stop-color="#141118"/>
    </linearGradient>

    <!-- Kurama Flame Gradient -->
    <linearGradient id="kuramaFlame" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF3300"/>
      <stop offset="50%" stop-color="#FF7700"/>
      <stop offset="100%" stop-color="#FFCC00"/>
    </linearGradient>

    <!-- Rasengan Cyan Gradient -->
    <linearGradient id="rasenganCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00FFFF"/>
      <stop offset="50%" stop-color="#00B4D8"/>
      <stop offset="100%" stop-color="#0077B6"/>
    </linearGradient>

    <!-- Border Glow Gradient -->
    <linearGradient id="borderGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF5500" stop-opacity="0.8"/>
      <stop offset="25%" stop-color="#FF9900" stop-opacity="0.3"/>
      <stop offset="50%" stop-color="#00E5FF" stop-opacity="0.8"/>
      <stop offset="75%" stop-color="#FF7700" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#FF3300" stop-opacity="0.8"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Dot Pattern -->
    <pattern id="dotGrid" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="12" cy="12" r="1" fill="#ffffff" fill-opacity="0.04"/>
    </pattern>

    <style>
      @keyframes chakraPulse {
        0%, 100% { opacity: 0.35; transform: scale(1); }
        50% { opacity: 0.75; transform: scale(1.08); }
      }
      @keyframes spinSlow {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }
      @keyframes spinReverse {
        from { transform: rotate(360deg); }
        to { transform: rotate(0deg); }
      }
      @keyframes floatSlow {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-8px); }
      }
      @keyframes shimmerLine {
        0% { stroke-dashoffset: 1000; }
        100% { stroke-dashoffset: 0; }
      }
      .chakra-ball {
        transform-origin: 1080px 240px;
        animation: chakraPulse 4s ease-in-out infinite;
      }
      .spin-forward {
        transform-origin: 1080px 240px;
        animation: spinSlow 14s linear infinite;
      }
      .spin-backward {
        transform-origin: 1080px 240px;
        animation: spinReverse 9s linear infinite;
      }
      .floating {
        animation: floatSlow 5s ease-in-out infinite;
      }
      .code-font {
        font-family: 'SF Pro Display', 'Fira Code', 'JetBrains Mono', 'Segoe UI', monospace;
      }
      .title-font {
        font-family: 'Impact', 'Montserrat', 'Arial Black', sans-serif;
        font-weight: 900;
        letter-spacing: 3px;
      }
    </style>
  </defs>

  <!-- Card Frame -->
  <rect width="1280" height="480" rx="20" fill="url(#bgGrad)"/>
  <rect width="1280" height="480" rx="20" fill="url(#dotGrid)"/>

  <!-- Glowing Border Outline -->
  <rect x="2" y="2" width="1276" height="476" rx="19" fill="none" stroke="url(#borderGlow)" stroke-width="2.5"/>

  <!-- Ambient Light Orbs -->
  <circle cx="220" cy="140" r="180" fill="#FF5500" opacity="0.12" filter="url(#glow)"/>
  <circle cx="1080" cy="240" r="220" fill="#00E5FF" opacity="0.10" filter="url(#glow)"/>
  <circle cx="640" cy="400" r="160" fill="#FF8800" opacity="0.08" filter="url(#glow)"/>

  <!-- Left Side: Konoha & Uzumaki Watermark -->
  <g transform="translate(180, 240)" opacity="0.04" stroke="#FF7700" stroke-width="8" fill="none">
    <circle cx="0" cy="0" r="140"/>
    <circle cx="0" cy="0" r="90"/>
    <path d="M-60,0 A60,60 0 1,1 60,0 A30,30 0 1,1 0,0"/>
  </g>

  <!-- TOP STATUS BADGE / TERMINAL PILL -->
  <g transform="translate(60, 48)">
    <rect x="0" y="0" width="410" height="34" rx="17" fill="#141824" stroke="#FF7700" stroke-width="1.2" stroke-opacity="0.6"/>
    <!-- Animated pulse dot -->
    <circle cx="18" cy="17" r="5" fill="#FF5500">
      <animate attributeName="opacity" values="1;0.3;1" dur="1.8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="18" cy="17" r="9" fill="none" stroke="#FF5500" stroke-width="1" opacity="0.6">
      <animate attributeName="r" values="6;13" dur="1.8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.8;0" dur="1.8s" repeatCount="indefinite"/>
    </circle>
    <text x="36" y="22" class="code-font" font-size="12" font-weight="700" fill="#FF9933" letter-spacing="1.5">
      HIDDEN LEAF SHINOBI • RANK: SPECIAL JONIN
    </text>
  </g>

  <!-- SHINOBI REGISTRATION ID PILL -->
  <g transform="translate(485, 48)">
    <rect x="0" y="0" width="190" height="34" rx="17" fill="#141824" stroke="#00E5FF" stroke-width="1.2" stroke-opacity="0.6"/>
    <text x="18" y="22" class="code-font" font-size="11.5" font-weight="700" fill="#00E5FF" letter-spacing="1.5">
      REG ID: #UZU-2K3
    </text>
  </g>

  <!-- MAIN HERO TITLE -->
  <g transform="translate(60, 145)">
    <!-- Sub-heading -->
    <text x="2" y="0" class="code-font" font-size="14" font-weight="600" fill="#FF9E40" letter-spacing="3">
      // JINCHŪRIKI OF INTELLIGENT SYSTEMS
    </text>

    <!-- Main Name -->
    <text x="0" y="62" class="title-font" font-size="56" fill="url(#kuramaFlame)" filter="url(#softGlow)">
      DIVYANSHU SRIVASTAVA
    </text>

    <!-- Role / Tagline -->
    <text x="2" y="106" class="code-font" font-size="21" font-weight="600" fill="#E2E8F0" letter-spacing="0.5">
      Full-Stack Engineer <tspan fill="#FF7700">•</tspan> AI &amp; NLP Craftsman <tspan fill="#00E5FF">•</tspan> Software Builder
    </text>

    <!-- Bio / Nindo Quote Banner -->
    <g transform="translate(0, 134)">
      <rect x="0" y="0" width="670" height="48" rx="10" fill="#121622" stroke="#252c40" stroke-width="1"/>
      <path d="M0,8 L0,40" stroke="#FF5500" stroke-width="4" stroke-linecap="round"/>
      <text x="18" y="29" class="code-font" font-size="13.5" font-style="italic" fill="#cbd5e1">
        "I never give up on a difficult bug, and I never go back on my word. That's my Ninja Way!"
      </text>
    </g>

    <!-- Stat Badges / Special Abilities -->
    <g transform="translate(0, 204)">
      <!-- Badge 1: Chakra Type -->
      <g transform="translate(0, 0)">
        <rect x="0" y="0" width="150" height="36" rx="8" fill="#171b29" stroke="#FF7700" stroke-width="1"/>
        <text x="14" y="23" class="code-font" font-size="12" font-weight="700" fill="#FF9933">🔥 FIRE &amp; LOGIC</text>
      </g>
      <!-- Badge 2: Primary Weapon -->
      <g transform="translate(162, 0)">
        <rect x="0" y="0" width="168" height="36" rx="8" fill="#171b29" stroke="#00E5FF" stroke-width="1"/>
        <text x="14" y="23" class="code-font" font-size="12" font-weight="700" fill="#00E5FF">🌀 PYTHON &amp; FLASK</text>
      </g>
      <!-- Badge 3: Special Jutsu -->
      <g transform="translate(342, 0)">
        <rect x="0" y="0" width="180" height="36" rx="8" fill="#171b29" stroke="#FFB800" stroke-width="1"/>
        <text x="14" y="23" class="code-font" font-size="12" font-weight="700" fill="#FFB800">⚡ NLP TRANSFORMERS</text>
      </g>
      <!-- Badge 4: Status -->
      <g transform="translate(534, 0)">
        <rect x="0" y="0" width="136" height="36" rx="8" fill="#171b29" stroke="#2fd48a" stroke-width="1"/>
        <text x="14" y="23" class="code-font" font-size="12" font-weight="700" fill="#2fd48a">✓ READY FOR WAR</text>
      </g>
    </g>
  </g>

  <!-- RIGHT SIDE: THE RASENGAN & KURAMA CHAKRA EMBLEM (High-Def Vector Graphic) -->
  <g class="floating">
    <!-- Outer Chakra Aura Rings -->
    <circle cx="1060" cy="240" r="170" fill="none" stroke="#FF5500" stroke-width="1.5" stroke-dasharray="14 10" opacity="0.3" class="spin-forward"/>
    <circle cx="1060" cy="240" r="145" fill="none" stroke="#00E5FF" stroke-width="2" stroke-dasharray="24 16" opacity="0.45" class="spin-backward"/>
    <circle cx="1060" cy="240" r="120" fill="none" stroke="#FFB800" stroke-width="2.5" stroke-dasharray="8 8" opacity="0.5" class="spin-forward"/>

    <!-- Central Glowing Core: Giant Rasengan Sphere -->
    <g class="chakra-ball">
      <!-- Outer Rasengan Core -->
      <circle cx="1060" cy="240" r="86" fill="url(#rasenganCyan)" opacity="0.22" filter="url(#glow)"/>
      <circle cx="1060" cy="240" r="70" fill="url(#bgGrad)" stroke="#00E5FF" stroke-width="3"/>
      
      <!-- Swirling Spirals of Chakra (Uzumaki Emblem) -->
      <path d="M1060,240 
               A20,20 0 0,1 1080,240 
               A35,35 0 0,1 1045,260 
               A50,50 0 0,1 1025,215 
               A65,65 0 0,1 1095,190
               A80,80 0 0,1 1135,265" 
            fill="none" stroke="url(#kuramaFlame)" stroke-width="5" stroke-linecap="round" filter="url(#softGlow)"/>

      <path d="M1060,240 
               A20,20 0 0,0 1040,240 
               A35,35 0 0,0 1075,220 
               A50,50 0 0,0 1095,265 
               A65,65 0 0,0 1025,290" 
            fill="none" stroke="url(#rasenganCyan)" stroke-width="3.5" stroke-linecap="round"/>

      <!-- Konoha Shinobi Symbol in center -->
      <path d="M1060,218 C1072,218 1082,228 1082,240 C1082,250 1074,258 1064,258 C1056,258 1050,252 1050,244 C1050,238 1054,234 1058,234 C1061,234 1063,236 1063,239 C1063,241 1061,243 1059,243"
            fill="none" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round"/>
      <path d="M1046,244 L1036,256" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round"/>
      <polygon points="1075,232 1085,227 1081,238" fill="#FFFFFF"/>
    </g>

    <!-- Chakra Spark Orbiters -->
    <circle cx="970" cy="180" r="5" fill="#00FFFF" filter="url(#softGlow)"/>
    <circle cx="1150" cy="170" r="4" fill="#FF5500" filter="url(#softGlow)"/>
    <circle cx="1165" cy="310" r="6" fill="#FFB800" filter="url(#softGlow)"/>
    <circle cx="960" cy="290" r="4.5" fill="#00E5FF" filter="url(#softGlow)"/>
    <circle cx="1060" cy="115" r="5" fill="#FF7700" filter="url(#softGlow)"/>
    <circle cx="1060" cy="365" r="4" fill="#00FFFF" filter="url(#softGlow)"/>

    <!-- Seal Tags Floating -->
    <g transform="translate(1170, 110) rotate(15)">
      <rect x="0" y="0" width="46" height="74" rx="4" fill="#ffedd5" stroke="#ea580c" stroke-width="1.5"/>
      <rect x="4" y="4" width="38" height="66" fill="none" stroke="#dc2626" stroke-width="1"/>
      <text x="23" y="24" font-family="sans-serif" font-weight="900" font-size="16" fill="#991b1b" text-anchor="middle">忍</text>
      <text x="23" y="46" font-family="sans-serif" font-weight="900" font-size="14" fill="#991b1b" text-anchor="middle">封</text>
      <text x="23" y="62" font-family="sans-serif" font-weight="700" font-size="10" fill="#991b1b" text-anchor="middle">火</text>
    </g>
  </g>

  <!-- Bottom Accent Line -->
  <line x1="60" y1="440" x2="1220" y2="440" stroke="#23293a" stroke-width="1.5"/>
  <line x1="60" y1="440" x2="480" y2="440" stroke="url(#kuramaFlame)" stroke-width="2.5" stroke-linecap="round"/>
</svg>
